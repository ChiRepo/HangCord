# gitleaks config — default rules plus HangCord-specific secret names.
# Run: gitleaks detect --source . --config .gitleaks.toml   (CI runs this on every push)
title = "HangCord gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "hangcord-secret-assignment"
description = "A HangCord secret name assigned a real-looking value (names are fine, values never)"
regex = '''(?i)\b(?:FIREBASE_WEB_API_KEY|FIREBASE_AUTH_ADMIN_SA_JSON|FIRESTORE_SA_JSON|FIRESTORE_BACKUP_SA_JSON|GOOGLE_OAUTH_DESKTOP_CLIENT_SECRET|BREVO_API_KEY|MAILJET_API_KEY|MAILJET_SECRET_KEY|RESEND_API_KEY|EMAIL_CODE_PEPPER|SESSION_SIGNING_KEY|TURNSTILE_SECRET_KEY|LIVEKIT_API_KEY|LIVEKIT_API_SECRET|CF_TURN_KEY_ID|CF_TURN_API_TOKEN|GIF_PROVIDER_API_KEY|HANGCORD_KEK_V\d+|CSV_ROUTINE_KEY|CSV_EMERGENCY_PRIVATE_KEY_V\d+|BACKUP2_API_KEY|B2_APPLICATION_KEY|GARAGE_SECRET_KEY|ORACLE_ARCHIVE_SECRET_KEY)\s*[=:]\s*["']?([A-Za-z0-9+/_\-]{12,})'''
secretGroup = 1

[[rules]]
id = "private-key-block"
description = "PEM private key"
regex = '''-----BEGIN (RSA |EC |)PRIVATE KEY-----'''

[[allowlists]]
description = "Secret NAMES (ALL_CAPS_SNAKE identifiers) are documentation, not values; example file lists names only"
regexTarget = "secret"
regexes = [
  '''^[A-Z][A-Z0-9]*(_[A-Z0-9]+)+$''',
]
paths = [
  '''\.dev\.vars\.example$''',
  '''node_modules/''',
  '''graphify/graph/cache/''',   # Graphify's file-hash cache (git-ignored, hashes only)
]
