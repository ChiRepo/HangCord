<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HangCord — Voice call</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111316}
a{color:#86B6FF}a:hover{color:#B3D0FF}
.hc button{font:inherit;color:inherit;border:0;cursor:pointer}
.hc button:focus-visible,.hc a:focus-visible{outline:2px solid #F2A93B;outline-offset:2px}
.ctl{width:52px;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;background:#22262D;color:#ECEEF1;transition:background .12s}
.ctl:hover{background:#2C3139}
.tile{position:relative;border-radius:14px;background:#181B20;border:1px solid #2A2F37;display:flex;align-items:center;justify-content:center;min-height:220px;overflow:hidden}
@media (max-width:900px){.grid{grid-template-columns:repeat(1,minmax(0,1fr)) !important}.chat{display:none}}
</style>
</helmet>
<div class="hc" style="display:flex;flex-wrap:wrap;height:100vh;min-height:900px;width:100%;background:#111316;color:#ECEEF1;font-family:Inter,sans-serif">

<main style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column">
<header style="height:56px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid #2A2F37">
<a href="Main.dc.html" aria-label="Back to Night Owls" style="display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:6px;color:#A9B0BA"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7M19 12H5"></path></svg></a>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#858E9B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg>
<h1 style="margin:0;font:600 16px/24px 'Space Grotesk',sans-serif">Lounge</h1>
<span style="font:500 13px/18px Inter,sans-serif;color:#A9B0BA">Night Owls · 4 people</span>
<span style="margin-left:auto;display:flex;align-items:center;gap:6px;font:500 13px/18px Inter,sans-serif;color:#34C77B"><span style="width:10px;height:10px;border-radius:50%;background:#34C77B"></span>Voice connected</span>
</header>

<section aria-label="Participants" class="grid" style="flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:20px;align-content:center">
<div class="tile" style="grid-column:1 / -1;min-height:340px;background:#15181C">
<div style="display:flex;flex-direction:column;align-items:center;gap:10px;color:#A9B0BA">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg>
<span style="font:500 14px/20px Inter,sans-serif">[Aarav's shared screen]</span>
</div>
<span style="position:absolute;left:12px;bottom:12px;padding:4px 10px;border-radius:6px;background:rgba(17,19,22,.85);font:500 13px/18px Inter,sans-serif">Aarav — sharing screen</span>
</div>
<div class="tile" style="outline:2px solid #34C77B;outline-offset:-2px">
<span style="width:88px;height:88px;border-radius:44px;background:#3B4A5E;font:600 28px/88px 'Space Grotesk',sans-serif;text-align:center">AR</span>
<span style="position:absolute;left:12px;bottom:12px;padding:4px 10px;border-radius:6px;background:rgba(17,19,22,.85);font:500 13px/18px Inter,sans-serif">Aarav · speaking</span>
</div>
<div class="tile">
<span style="width:88px;height:88px;border-radius:44px;background:#5A4A3B;font:600 28px/88px 'Space Grotesk',sans-serif;text-align:center">MI</span>
<span style="position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;background:rgba(17,19,22,.85);font:500 13px/18px Inter,sans-serif">Mira<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F0605A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="muted"><path d="M2 2l20 20M18.9 13.2A7 7 0 0 0 19 12v-2M5 10v2a7 7 0 0 0 12 5M15 9.3V5a3 3 0 0 0-5.7-1.3M9 9v3a3 3 0 0 0 5.1 2.1M12 19v3"></path></svg></span>
</div>
<div class="tile">
<span style="width:88px;height:88px;border-radius:44px;background:#3E5A4A;font:600 28px/88px 'Space Grotesk',sans-serif;text-align:center">KS</span>
<span style="position:absolute;left:12px;bottom:12px;padding:4px 10px;border-radius:6px;background:rgba(17,19,22,.85);font:500 13px/18px Inter,sans-serif">Kabir</span>
</div>
<div class="tile">
<span style="width:88px;height:88px;border-radius:44px;background:#4B3F6B;font:600 26px/88px 'Space Grotesk',sans-serif;text-align:center">YOU</span>
<span style="position:absolute;left:12px;bottom:12px;padding:4px 10px;border-radius:6px;background:rgba(17,19,22,.85);font:500 13px/18px Inter,sans-serif">[your name] (you)</span>
</div>
</section>

<div role="toolbar" aria-label="Call controls" style="display:flex;justify-content:center;align-items:center;gap:12px;padding:16px 20px 24px;flex-wrap:wrap">
<button class="ctl" aria-label="Mute microphone" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"></path></svg></button>
<button class="ctl" aria-label="Deafen" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"></path></svg></button>
<button class="ctl" aria-label="Turn on camera" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 8-6 4 6 4V8Z"></path><rect x="2" y="6" width="14" height="12" rx="2"></rect></svg></button>
<button class="ctl" aria-label="Share screen" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M8 21h8M12 17v4M9 10l3-3 3 3M12 7v7"></path></svg></button>
<button class="ctl" aria-label="Voice settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"></path></svg></button>
<a href="Main.dc.html" aria-label="Leave call" style="width:72px;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;background:#B8322C;color:#FFFFFF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.7 13.3a16 16 0 0 0 3.4 2.6l1.3-1.3a2 2 0 0 1 2.1-.4 12.8 12.8 0 0 0 2.8.7 2 2 0 0 1 1.7 2v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.4 19.4 0 0 1-3.3-2.7m-2.7-3.3a19.8 19.8 0 0 1-3.1-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7 12.8 12.8 0 0 0 .7 2.8 2 2 0 0 1-.4 2.1L8.1 9.9M22 2 2 22"></path></svg></a>
</div>
</main>

<aside class="chat" aria-label="Lounge text chat" style="flex:1 1 320px;max-width:340px;display:flex;flex-direction:column;background:#181B20;border-left:1px solid #2A2F37">
<div style="height:56px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #2A2F37;font:600 15px/22px 'Space Grotesk',sans-serif">Chat in Lounge</div>
<div style="flex:1;overflow:auto;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding:16px">
<div><div style="font:600 14px/20px Inter,sans-serif;color:#86B6FF">Aarav</div><p style="margin:0;font:400 14px/20px Inter,sans-serif">screen's up — question 3 is the tricky one</p></div>
<div><div style="font:600 14px/20px Inter,sans-serif">Mira</div><p style="margin:0;font:400 14px/20px Inter,sans-serif">muted, my roommate's asleep. typing here</p></div>
<div style="font:500 12px/16px Inter,sans-serif;color:#858E9B">Kabir joined the call</div>
</div>
<div style="padding:12px 16px 16px">
<label style="display:flex;align-items:center;height:44px;padding:0 12px;border-radius:10px;background:#22262D;border:1px solid #2A2F37"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Message Lounge</span><input placeholder="Message Lounge" style="flex:1;min-width:0;background:transparent;border:0;outline:none;color:#ECEEF1;font:400 14px/20px Inter,sans-serif"></label>
</div>
</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
