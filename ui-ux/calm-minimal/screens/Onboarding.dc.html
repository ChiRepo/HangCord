<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HangCord — Your first hangout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111316}
a{color:#86B6FF}a:hover{color:#B3D0FF}
.hc button,.hc input{font:inherit}
.hc button:focus-visible,.hc a:focus-visible,.hc input:focus-visible{outline:2px solid #F2A93B;outline-offset:2px}
.opt{display:flex;align-items:center;gap:14px;padding:16px;border-radius:10px;background:#181B20;border:1px solid #2A2F37;color:#ECEEF1;text-decoration:none;text-align:left;cursor:pointer;transition:background .12s,border-color .12s}
.opt:hover{background:#1D2026;border-color:#3A404A}
</style>
</helmet>
<div class="hc" style="min-height:100vh;width:100%;display:flex;flex-direction:column;background:#111316;color:#ECEEF1;font-family:Inter,sans-serif">
<header style="display:flex;align-items:center;justify-content:space-between;padding:24px 32px">
<div style="display:flex;align-items:center;gap:10px"><span style="width:32px;height:32px;border-radius:9px;background:#F2A93B;color:#1A1205;font:700 16px/32px 'Space Grotesk',sans-serif;text-align:center">H</span><span style="font:700 18px/24px 'Space Grotesk',sans-serif">HangCord</span></div>
<span style="font:500 13px/18px Inter,sans-serif;color:#858E9B">Step 3 of 3</span>
</header>
<main style="flex:1;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:48px;padding:24px 32px 48px">

<section style="flex:1 1 380px;max-width:460px;display:flex;flex-direction:column;gap:16px" aria-labelledby="ob-title">
<h1 id="ob-title" style="margin:0;font:700 32px/40px 'Space Grotesk',sans-serif">Find your people</h1>
<p style="margin:0;font:400 16px/24px Inter,sans-serif;color:#A9B0BA">A hangout is your own space — rooms for chatting, lounges for calling. Start one or join friends who already have one.</p>

<a href="Main.dc.html" class="opt">
<span style="width:44px;height:44px;flex-shrink:0;border-radius:12px;background:#F2A93B;color:#1A1205;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg></span>
<span style="display:flex;flex-direction:column"><span style="font:600 15px/22px Inter,sans-serif">Create a hangout</span><span style="font:400 14px/20px Inter,sans-serif;color:#A9B0BA">For friends, a class, a club or a game</span></span>
</a>

<div class="opt" style="flex-direction:column;align-items:stretch;gap:12px;cursor:default">
<div style="display:flex;align-items:center;gap:14px">
<span style="width:44px;height:44px;flex-shrink:0;border-radius:12px;background:#22262D;color:#34C77B;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"></path><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"></path></svg></span>
<span style="display:flex;flex-direction:column"><span style="font:600 15px/22px Inter,sans-serif">Join with an invite</span><span style="font:400 14px/20px Inter,sans-serif;color:#A9B0BA">Paste a link a friend sent you</span></span>
</div>
<div style="display:flex;gap:8px">
<label style="flex:1;min-width:0;display:flex"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Invite link</span><input placeholder="hangcord.app/invite/…" style="flex:1;min-width:0;height:40px;padding:0 12px;border-radius:6px;background:#111316;border:1px solid #2A2F37;color:#ECEEF1;font:400 14px/20px Inter,sans-serif"></label>
<a href="Main.dc.html" style="height:40px;display:flex;align-items:center;padding:0 16px;border-radius:6px;background:#22262D;border:1px solid #3A404A;color:#ECEEF1;font:500 14px/20px Inter,sans-serif;text-decoration:none">Join</a>
</div>
</div>

<a href="Main.dc.html" style="align-self:flex-start;font:500 14px/20px Inter,sans-serif">Skip for now</a>
</section>

<section aria-label="Profile preview" style="flex:0 1 340px;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#181B20;border:1px solid #2A2F37">
<div style="height:96px;background:#2A2F37"></div>
<div style="padding:0 20px 20px;display:flex;flex-direction:column;gap:12px">
<span style="margin-top:-36px;width:72px;height:72px;border-radius:36px;background:#4B3F6B;border:6px solid #181B20;font:600 22px/72px 'Space Grotesk',sans-serif;text-align:center">YOU</span>
<div style="display:flex;flex-direction:column;gap:6px">
<label for="ob-name" style="font:500 14px/20px Inter,sans-serif">Display name</label>
<input id="ob-name" value="[your name]" style="height:40px;padding:0 12px;border-radius:6px;background:#111316;border:1px solid #2A2F37;color:#ECEEF1;font:400 15px/22px Inter,sans-serif">
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<label for="ob-handle" style="font:500 14px/20px Inter,sans-serif">Username</label>
<input id="ob-handle" value="[username]" aria-describedby="ob-ok" style="height:40px;padding:0 12px;border-radius:6px;background:#111316;border:1px solid #2A2F37;color:#ECEEF1;font:400 15px/22px Inter,sans-serif">
<span id="ob-ok" style="display:flex;align-items:center;gap:6px;font:500 13px/18px Inter,sans-serif;color:#34C77B"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Available</span>
</div>
<button type="button" style="height:36px;align-self:flex-start;padding:0 14px;border-radius:6px;background:transparent;border:1px solid #3A404A;color:#ECEEF1;font:500 14px/20px Inter,sans-serif;cursor:pointer">Upload a photo</button>
</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
