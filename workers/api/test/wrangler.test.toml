# Local integration tests only (test/api.int.test.ts). Test values, never real secrets.
name = "hangcord-api-test"
main = "entry.ts"
compatibility_date = "2026-10-01"

[vars]
FIREBASE_PROJECT_ID = "hangcord-test"

[[d1_databases]]
binding = "DB"
database_name = "hangcord-test"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../migrations"

[[durable_objects.bindings]]
name = "USERS"
class_name = "UserDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserDO"]
