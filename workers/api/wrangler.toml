# REST API Worker (MASTER_PLAN §6). Secrets are NEVER written here — set them with
#   npx wrangler secret put <NAME>            (owner only; see docs/SECRETS_AND_SENSITIVE_DATA.md)
# Local dev: copy names from /.dev.vars.example into workers/api/.dev.vars (git-ignored).
name = "hangcord-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Public values only (docs/SECRETS_AND_SENSITIVE_DATA.md). Filled in by the owner when the accounts exist.
[vars]
GOOGLE_OAUTH_DESKTOP_CLIENT_ID = "704036408206-3iuj8vj3ekl00ep8rrj6lec6pkr4t19e.apps.googleusercontent.com"
TURNSTILE_SITE_KEY = ""
LIVEKIT_URL = ""
EMAIL_FROM_ADDRESS = ""

# D1: the owner creates it once with `npx wrangler d1 create hangcord` and pastes the id here
# (an id is not a secret). Schema: migrations/ → `npx wrangler d1 migrations apply hangcord --remote`.
[[d1_databases]]
binding = "DB"
database_name = "hangcord"
database_id = "f52a5d63-ea01-4e2e-b933-8a8082edfa94"
migrations_dir = "migrations"

# UserDO: refresh-token hashes (Cloudflare-only sensitive state).
[[durable_objects.bindings]]
name = "USERS"
class_name = "UserDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserDO"]

# Message REST routes delegate to the same RoomDO path as the gateway.
[[services]]
binding = "GATEWAY"
service = "hangcord-gateway"
