# WebSocket gateway Worker (MASTER_PLAN §6). RoomDO sockets; HangoutDO key custody.
# Secrets via `npx wrangler secret put <NAME>` only (owner).
name = "hangcord-gateway"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "hangcord"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../api/migrations"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"
[[durable_objects.bindings]]
name = "HANGOUTS"
class_name = "HangoutDO"
[[durable_objects.bindings]]
name = "USERS"
class_name = "UserDO"
script_name = "hangcord-api"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO", "HangoutDO"]
