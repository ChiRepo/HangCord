# Release → installers for Windows, macOS and Linux attached to a DRAFT GitHub Release. Three ways in:
#   1. push the `release` branch (git push origin main:release) → tag v<version in tauri.conf.json> is created
#   2. push a tag like v0.1.0
#   3. run manually with an existing tag
# The draft is The owner reviews and publishes it.
# Unsigned for now (code signing is an open owner decision — handoff.md). Never uses any secret except
# the built-in GITHUB_TOKEN.
name: release
on:
  push:
    tags: ["v*"]
    branches: [release]
  workflow_dispatch:
    inputs:
      tag: { description: "Existing tag to release (e.g. v0.1.0)", required: true }

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, bundles: "deb appimage", name: linux }
          - { os: windows-latest, bundles: "nsis msi", name: windows }
          - { os: macos-latest, bundles: "app dmg", name: macos }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ inputs.tag || github.sha }}" }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libssl-dev libdbus-1-dev pkg-config build-essential
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2.9.3
        with: { workspaces: "apps/desktop/src-tauri -> target" }
      - run: npm ci
      - run: cargo test --locked
        working-directory: apps/desktop/src-tauri
      - run: npx tauri build --bundles ${{ matrix.bundles }} --ci
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: hangcord-${{ matrix.name }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ inputs.tag || github.sha }}", path: src }
      - uses: actions/download-artifact@v7
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Draft GitHub Release with the installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_IN: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          TAG="${TAG_IN:-v$(node -p "require('./src/apps/desktop/src-tauri/tauri.conf.json').version")}"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "HangCord $TAG" \
            --notes "HangCord desktop app $TAG — Windows (.exe / .msi), macOS (.dmg), Linux (.deb / AppImage). Unsigned early build: expect bugs; Windows SmartScreen and macOS Gatekeeper will warn the first time. Verify downloads with SHA256SUMS.txt."
