# CI for the real application (MASTER_PLAN §13, §15, §16.1). The web companion's CI lives on WebApp. Branches: main = the real application,
# WebApp = web companion work. Releases are built by release.yml.
#
# Free-minute budget (private repo: 2,000 min/month; Windows counts 2×, macOS 10×):
#   checks + secrets-scan + desktop-linux run on every push/PR.
#   desktop-windows runs on pushes to main and on manual runs. desktop-macos runs only on manual runs
#   (the owner builds macOS on the Mac — apps/desktop/README.md).
name: ci
on:
  push:
    branches: [main, WebApp]   # other branches are covered by their pull request (no double runs)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Public service origins for packaged desktop builds. The native test step overrides both.
env:
  HANGCORD_API_BASE_URL: https://hangcord-api.jyotsnachaudhari999.workers.dev
  HANGCORD_GATEWAY_BASE_URL: wss://hangcord-gateway.jyotsnachaudhari999.workers.dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck:js   # Rust is checked in desktop-linux
      - run: npm run test:js
      - run: npm run build
      - run: npm run check:secrets-names
      - run: npx playwright install --with-deps chromium
        working-directory: tests/ui
      - run: npm run ui-test
        env: { CI: "true" }

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # gitleaks CLI pinned to the version used locally (no licence or PR-comment permissions needed).
      - name: gitleaks (full history)
        run: |
          curl -sSfL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gl.tgz gitleaks && rm gl.tgz
          if ! ./gitleaks git . --config .gitleaks.toml --redact --no-banner --report-format json --report-path leaks.json; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::gitleaks \(.RuleID) in commit \(.Commit[0:7])"' leaks.json
            exit 1
          fi

  # The code map (graphify/README.md) must match the code in every push/PR. Local parsing only — no AI, no keys.
  code-map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: pipx install "graphifyy==$(sed -n 's/^graphifyy==//p' graphify/requirements.txt)"
      - run: sh graphify/refresh.sh --check

  # The real desktop app: Rust tests, an authenticated local HTTP/WS fixture through the built
  # test-hooks app and native keychain, then the release .deb / AppImage.
  desktop-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - name: Linux libraries for Tauri + WebDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libssl-dev libdbus-1-dev pkg-config \
            build-essential webkit2gtk-driver xvfb dbus gnome-keyring
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2.9.3
        with: { workspaces: "apps/desktop/src-tauri -> target" }
      - run: npm ci
      - name: Rust unit tests
        run: cargo test --locked
        working-directory: apps/desktop/src-tauri
      - name: Build the app with test hooks and local protocol fixture (never shipped)
        run: npx tauri build --no-bundle --features test-hooks --ci
        env:
          HANGCORD_API_BASE_URL: http://127.0.0.1:39431
          HANGCORD_GATEWAY_BASE_URL: ws://127.0.0.1:39431
      - run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Desktop e2e (native auth, HTTP, WebSocket, cache, keychain, single instance)
        run: |
          xvfb-run -a dbus-run-session -- bash -euo pipefail -c '
            printf "%s\n" "hangcord-ci-test-keyring" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            node tests/desktop/run.mjs apps/desktop/src-tauri/target/release/hangcord-desktop
          '
      - name: Release installers (no test hooks)
        run: npx tauri build --bundles deb appimage --ci
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: hangcord-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7

  desktop-windows:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2.9.3
        with: { workspaces: "apps/desktop/src-tauri -> target" }
      - run: npm ci
      - run: cargo test --locked
        working-directory: apps/desktop/src-tauri
      - run: npx tauri build --bundles nsis msi --ci
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: hangcord-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 7

  desktop-macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2.9.3
        with: { workspaces: "apps/desktop/src-tauri -> target" }
      - run: npm ci
      - run: cargo test --locked
        working-directory: apps/desktop/src-tauri
      - run: npx tauri build --bundles app dmg --ci
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: hangcord-macos-unsigned
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 7
