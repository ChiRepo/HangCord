[package]
name = "hangcord-desktop"
version = "0.0.1"
description = "HangCord desktop app — Rust core (MASTER_PLAN §4, §11, §7.1)"
edition = "2021"
rust-version = "1.95"
license = "UNLICENSED"
publish = false

[lib]
name = "hangcord_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Test-only switches (e.g. HANGCORD_KEY_STORAGE=file). Never enabled in release installers.
test-hooks = []

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-window-state = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
aes-gcm = "0.10.3"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
